র<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>হিস্যা ও জমি ক্যালকুলেটর</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:'Noto Sans Bengali',sans-serif;color:#172033;background:radial-gradient(circle at 0 0,#e0e7ff,transparent 32%),radial-gradient(circle at 100% 0,#ccfbf1,transparent 30%),linear-gradient(145deg,#f4f7ff,#effdfa)}
button,select{font-family:inherit}
.app{width:min(560px,100%);height:100dvh;margin:auto;padding:10px 12px;display:flex;flex-direction:column;overflow:hidden}
.header{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex:0 0 auto}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:800;background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 7px 18px #4f46e533}.header h1{margin:0;font-size:19px}
.card{min-height:0;flex:1;background:#fffffff2;border-radius:23px;padding:13px;box-shadow:0 16px 42px #1e293b1f;display:flex;flex-direction:column;overflow:hidden}
h2{font-size:20px;margin:0 0 6px}.form-area{flex:0 0 auto}
label{font-size:11px;font-weight:800;margin:6px 0 4px;display:block}.label-unit{font-size:10px;color:#64748b;font-weight:700}.head-unit{font-size:9px;color:#64748b;font-weight:700}
select,.field{width:100%;height:52px;border:1.5px solid #e1e6f0;border-radius:13px;background:#f9fbff;color:#172033;font-family:inherit;font-size:14px}
select{appearance:none;padding:0 38px 0 13px}.select{position:relative}.select:after{content:"⌄";position:absolute;right:13px;top:4px;font-size:22px;color:#4f46e5;pointer-events:none}
.field{display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:800;font-size:20px;user-select:none}.field.placeholder{color:#a5adbb;font-size:13px;font-weight:500}.field.active{border-color:#6366f1;box-shadow:0 0 0 3px #6366f11a;background:#fff}.field .value{overflow:hidden;text-overflow:ellipsis}.unit{font-size:11px;font-weight:800;color:#6366f1;background:#eef0ff;padding:5px 9px;border-radius:8px;flex:0 0 auto}
.result{margin-top:8px;padding:9px 14px;border-radius:17px;color:#fff;background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 9px 22px #4f46e533;flex:0 0 auto}.result-label{font-size:10px;opacity:.85}.result-value{font-size:32px;font-weight:800;line-height:1.18}.result-unit{font-size:9px;opacity:.82}
.keypad{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(5,minmax(0,1fr));gap:6px;margin-top:7px}
.key{min-height:0;border:0;border-radius:12px;background:#f1f4f9;color:#172033;font-size:18px;font-weight:700}.key:active,.small-btn:active,.add-owner:active{transform:scale(.97)}.action{background:#20283a;color:#fff;font-size:13px}.clear{background:#fff0f1;color:#e11d48}.delete{background:#fff4e8;color:#ea580c}.reset-key{background:#eef0ff;color:#4f46e5;font-size:12px}.enter-key{background:#e8f7f4;color:#0f766e;font-size:25px}
.actions{display:grid;grid-template-columns:1fr;gap:7px;margin-top:7px;flex:0 0 auto}.actions button{height:45px;border:0;border-radius:13px;font-size:14px;font-weight:800}.calc{color:#fff;background:linear-gradient(135deg,#0f766e,#06b6a4)}
.special{min-height:0;display:flex;flex-direction:column;overflow:hidden;flex:0 0 43%}
.owner-head{display:grid;grid-template-columns:34px 1.25fr .8fr .95fr 34px;gap:6px;align-items:end;margin-top:3px;color:#334a9b;font-size:11px;font-weight:800;text-align:center;flex:0 0 auto}
.owner-list{min-height:0;overflow:auto;padding:4px 0 2px;scrollbar-width:none;flex:1}.owner-list::-webkit-scrollbar{display:none}
.owner-row{display:grid;grid-template-columns:34px 1.25fr .8fr .95fr 34px;gap:6px;align-items:center;margin-bottom:6px}
.owner-no{width:34px;height:34px;border-radius:50%;background:#f0f3f9;display:grid;place-items:center;font-weight:800;color:#475569;font-size:14px}
.owner-input,.owner-land,.owner-share{height:46px;width:100%;border:1.5px solid #e1e6f0;border-radius:12px;background:#fff;color:#172033;padding:0 9px;font-size:14px;outline:none}
.owner-input:focus,.owner-land:focus,.owner-land.selected{border-color:#6366f1;box-shadow:0 0 0 3px #6366f11a}
.owner-input{font-weight:500}.owner-land{text-align:center;font-weight:700}.owner-share{display:flex;align-items:center;justify-content:center;background:#edf5ff;border-color:#bfdbfe;color:#234b9d;font-size:17px;font-weight:800;white-space:nowrap}
.remove-owner{height:46px;border:1.5px solid #e1e6f0;border-radius:12px;background:#fff;color:#64748b;font-size:20px}.add-owner{height:43px;border:0;border-radius:13px;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-size:14px;font-weight:800;flex:0 0 auto;margin-top:4px}
.owner-summary{margin-top:7px;padding:10px 13px;border-radius:16px;background:#f7f9fd;border:1px solid #e2e7f0;display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:0 0 auto}.sum-label{font-size:9px;color:#697386}.summary-unit{font-weight:800;color:#475569}.sum-value{font-size:22px;font-weight:800;color:#2563eb;line-height:1.15}
@media(max-height:680px){.app{padding:7px 10px}.card{padding:10px}.header{margin-bottom:5px}.header h1{font-size:17px}.logo{width:38px;height:38px}.field,select{height:47px}.result{padding:7px 12px}.result-value{font-size:27px}.keypad{gap:4px;margin-top:4px}.key{border-radius:10px}.actions button{height:40px}.owner-input,.owner-land,.owner-share,.remove-owner{height:40px}.owner-no{height:30px;width:30px}.owner-head,.owner-row{grid-template-columns:30px 1.25fr .8fr .95fr 30px;gap:4px}.add-owner{height:38px}}
</style>
\n<link rel="manifest" href="./manifest.webmanifest">\n<meta name="theme-color" content="#4f46e5">\n<link rel="icon" href="./icon.svg" type="image/svg+xml">\n</head>
<body>
<div class="app">
  <div class="header"><div class="logo">▱</div><div><h1>হিস্যা ও জমি ক্যালকুলেটর</h1></div></div>
  <div class="card">
    <div class="form-area">
      <h2 id="title">মালিকের হিস্যা/অংশ নির্ণয়</h2>
      <label>হিসাবের ধরন</label>
      <div class="select"><select id="mode" onchange="modeChange()">
        <option value="share">মালিকের হিস্যা/অংশ নির্ণয়</option>
        <option value="land">খতিয়ানে প্রাপ্ত জমি নির্ণয়</option>
        <option value="schedule">আবেদনে তফসিলে হিস্যা</option>
      </select></div>
    </div>

    <div id="normalArea">
      <label>মোট জমি <span class="label-unit">(শতাংশ)</span></label>
      <div id="total" class="field placeholder" onclick="active='total';render()"><span class="value"></span><span class="unit">শতাংশ</span></div>

      <label id="secondLabel">খতিয়ানে প্রাপ্ত জমি <span class="label-unit">(শতাংশ)</span></label>
      <div id="second" class="field placeholder" onclick="active='second';render()"><span class="value"></span><span class="unit" id="secondUnit">শতাংশ</span></div>

      <div class="result"><div class="result-label" id="rLabel">খতিয়ানে মালিকের হিস্যা</div><div class="result-value" id="result">০.০০০০</div><div class="result-unit" id="rUnit">অংশ / হিস্যা</div></div>
    </div>

    <div id="scheduleArea" class="special" style="display:none">
      <div class="owner-head"><div>নং</div><div>মালিকের নাম</div><div>প্রাপ্য জমি<br><span class="head-unit">(শতাংশ)</span></div><div>হিস্যা</div><div></div></div>
      <div id="ownerList" class="owner-list"></div>
      <button class="add-owner" onclick="addOwner()">＋ মালিক যোগ করুন</button>
      <div class="owner-summary">
        <div><div class="sum-label">সকলের মোট জমি <span class="summary-unit">(একর)</span></div><div class="sum-value" id="sumLand">০.০০০০</div></div>
        <div><div class="sum-label">মোট হিস্যা</div><div class="sum-value" id="sumShare">০</div></div>
      </div>
    </div>

    <div id="keypadArea" style="display:flex;flex:1;min-height:0;flex-direction:column">
      <div id="normalKeypad" class="keypad">
        <button class="key clear" onclick="clearOne()">C</button><button class="key action" onclick="allClear()">AC</button><button class="key delete" onclick="back()">⌫</button>
        <button class="key" onclick="press('1')">১</button><button class="key" onclick="press('2')">২</button><button class="key" onclick="press('3')">৩</button>
        <button class="key" onclick="press('4')">৪</button><button class="key" onclick="press('5')">৫</button><button class="key" onclick="press('6')">৬</button>
        <button class="key" onclick="press('7')">৭</button><button class="key" onclick="press('8')">৮</button><button class="key" onclick="press('9')">৯</button>
        <button class="key reset-key" onclick="allClear()">রিসেট</button><button class="key" onclick="press('0')">০</button><button class="key" onclick="press('.')">.</button>
      </div>
      <div id="scheduleKeypad" class="keypad" style="display:none">
        <button class="key clear" onclick="clearOne()">C</button><button class="key action" onclick="allClear()">AC</button><button class="key delete" onclick="back()">⌫</button>
        <button class="key" onclick="press('1')">১</button><button class="key" onclick="press('2')">২</button><button class="key" onclick="press('3')">৩</button>
        <button class="key" onclick="press('4')">৪</button><button class="key" onclick="press('5')">৫</button><button class="key" onclick="press('6')">৬</button>
        <button class="key" onclick="press('7')">৭</button><button class="key" onclick="press('8')">৮</button><button class="key" onclick="press('9')">৯</button>
        <button class="key reset-key" onclick="allClear()">রিসেট</button><button class="key" onclick="press('0')">০</button><button class="key enter-key" onclick="nextOwner()">↵</button>
      </div>
      <div id="resultActions" class="actions"><button class="calc" onclick="calculate()">ফলাফল</button></div>
    </div>
  </div>
</div>

<script>
let active='total', v={total:'',second:''};
let owners=[{name:'',land:''}], activeOwner=null, activeOwnerField=null;

const mode=()=>document.getElementById('mode').value;
const bn=x=>String(x).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const fmt2=x=>bn(Number(x).toFixed(2));

function render(){
  let m=mode();
  let t=document.getElementById('total'),s=document.getElementById('second');
  t.querySelector('.value').textContent=v.total?bn(v.total):'মোট জমির পরিমাণ দিন';
  s.querySelector('.value').textContent=v.second?bn(v.second):(m==='share'?'খতিয়ানে প্রাপ্ত জমির পরিমাণ দিন':'মালিকের হিস্যা / অংশ দিন');
  document.getElementById('secondUnit').textContent=m==='share'?'শতাংশ':'(১-১০০০)';
  t.classList.toggle('placeholder',!v.total);s.classList.toggle('placeholder',!v.second);
  t.classList.toggle('active',active==='total' && m!=='schedule');s.classList.toggle('active',active==='second' && m!=='schedule');
  if(m==='schedule') renderOwners();
}

function press(c){
  if(mode()==='schedule'){
    if(activeOwner===null || activeOwnerField!=='land') return;
    let x=owners[activeOwner].land||'';
    if(c==='.' && x.includes('.')) return;
    if(x==='0' && c!=='.') x='';
    let n=Number(x+c);
    if(!Number.isFinite(n)||n>1000) return;
    owners[activeOwner].land=x+c;
    renderOwners();
    return;
  }
  let x=v[active]||'';
  if(c==='.'&&x.includes('.'))return;
  if(x==='0'&&c!=='.')x='';
  let n=Number(x+c);if(!Number.isFinite(n)||n>1000)return;
  v[active]=x+c;render();
}

function back(){
  if(mode()==='schedule'){
    if(activeOwner!==null && activeOwnerField==='land'){
      owners[activeOwner].land=(owners[activeOwner].land||'').slice(0,-1);
      renderOwners();
    }
    return;
  }
  v[active]=(v[active]||'').slice(0,-1);render();
}
function clearOne(){
  if(mode()==='schedule'){
    if(activeOwner!==null && activeOwnerField==='land'){
      owners[activeOwner].land='';
      renderOwners();
    }
    return;
  }
  v[active]='';render();
}
function allClear(){
  if(mode()==='schedule'){
    owners=[{name:'',land:''}];activeOwner=null;activeOwnerField=null;renderOwners();return;
  }
  v={total:'',second:''};
  document.getElementById('result').textContent=mode()==='share'?'০.০০০০':'০.০০';
  active='total';render();
}

function modeChange(){
  let m=mode(),share=m==='share',schedule=m==='schedule';
  document.getElementById('title').textContent=share?'মালিকের হিস্যা/অংশ নির্ণয়':m==='land'?'খতিয়ানে প্রাপ্ত জমি নির্ণয়':'আবেদনে তফসিলে হিস্যা';

  document.getElementById('normalArea').style.display=schedule?'none':'block';
  document.getElementById('scheduleArea').style.display=schedule?'flex':'none';
  document.getElementById('normalKeypad').style.display=schedule?'none':'grid';
  document.getElementById('scheduleKeypad').style.display=schedule?'grid':'none';
  document.getElementById('resultActions').style.display=schedule?'none':'grid';

  if(schedule){
    if(!owners.length) owners=[{name:'',land:''}];
    activeOwner=0; activeOwnerField='land';
    renderOwners();
    return;
  }

  document.getElementById('secondLabel').innerHTML=share
    ? 'খতিয়ানে প্রাপ্ত জমি <span class="label-unit">(শতাংশ)</span>'
    : 'খতিয়ানে মালিকের হিস্যা';
  document.getElementById('rLabel').textContent=share?'খতিয়ানে মালিকের হিস্যা':'খতিয়ানে প্রাপ্ত জমি';
  document.getElementById('rUnit').textContent=share?'অংশ / হিস্যা':'শতাংশ';
  v={total:'',second:''};
  document.getElementById('result').textContent=share?'০.০০০০':'০.০০';
  active='total';
  render();
}

function calculate(){
  let t=Number(v.total),s=Number(v.second),share=mode()==='share';
  if(!Number.isFinite(t)||t<=0){alert('মোট জমির সঠিক পরিমাণ দিন।');active='total';render();return}
  if(!Number.isFinite(s)||s<=0){alert(share?'খতিয়ানে প্রাপ্ত জমির সঠিক পরিমাণ দিন।':'মালিকের হিস্যার সঠিক মান দিন।');active='second';render();return}
  if(share){
    if(s>t){alert('খতিয়ানে প্রাপ্ত জমি মোট জমির চেয়ে বেশি হতে পারে না।');return}
    document.getElementById('result').textContent=bn((s/t).toFixed(4));
  }else{
    document.getElementById('result').textContent=bn((t*(s<=1?s:s/1000)).toFixed(2));
  }
}

function nextOwner(){
  if(mode()!=='schedule') return;
  if(activeOwner===null) { activeOwner=0; activeOwnerField='land'; renderOwners(); return; }
  if(activeOwnerField!=='land') { activeOwnerField='land'; renderOwners(); return; }

  if(activeOwner < owners.length-1){
    activeOwner++;
    activeOwnerField='land';
    renderOwners();
    return;
  }

  // Last owner: create the next owner and focus its land field.
  owners.push({name:'',land:''});
  activeOwner=owners.length-1;
  activeOwnerField='land';
  renderOwners();
  setTimeout(()=>document.getElementById('ownerList').scrollTop=999999,50);
}

function addOwner(){owners.push({name:'',land:''});renderOwners();setTimeout(()=>document.getElementById('ownerList').scrollTop=999999,50)}
function removeOwner(i){
  if(owners.length===1){owners[0]={name:'',land:''};}
  else owners.splice(i,1);
  if(activeOwner===i){activeOwner=null;activeOwnerField=null;}
  renderOwners();
}
function ownerName(i,el){owners[i].name=el.value}
function ownerLand(i,el){owners[i].land=el.value;updateOwnerShares()}
function focusOwner(i,field){activeOwner=i;activeOwnerField=field}
function renderOwners(){
  const list=document.getElementById('ownerList');
  list.innerHTML=owners.map((o,i)=>{
    const total=owners.reduce((a,x)=>a+(Number(x.land)||0),0);
    const sh=total>0?(Number(o.land)||0)/total*1000:0;
    const share=Number.isFinite(sh)?Math.round(sh):0;
    return `<div class="owner-row">
      <div class="owner-no">${bn(i+1)}</div>
      <input class="owner-input" type="text" inputmode="text" placeholder="মালিকের নাম" value="${esc(o.name)}"
        onfocus="focusOwner(${i},'name')" oninput="ownerName(${i},this)">
      <input class="owner-land ${activeOwner===i && activeOwnerField==='land' ? 'selected' : ''}" type="text" inputmode="none" placeholder="০" value="${bn(o.land)}"
        onfocus="focusOwner(${i},'land')" onclick="focusOwner(${i},'land');event.preventDefault();renderOwners()"
        onkeydown="return false" readonly>
      <div class="owner-share">${bn(share)}</div>
      <button class="remove-owner" onclick="removeOwner(${i})">×</button>
    </div>`;
  }).join('');
  const total=owners.reduce((a,x)=>a+(Number(x.land)||0),0);
  document.getElementById('sumLand').textContent=bn((total/100).toFixed(4));
  document.getElementById('sumShare').textContent=bn(total>0?1000:0);
}
function updateOwnerShares(){renderOwners()}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
}
</script>
</body>
</html>
