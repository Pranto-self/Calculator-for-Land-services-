<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>হিস্যা ও জমি ক্যালকুলেটর</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:'Noto Sans Bengali',sans-serif;color:#172033;background:radial-gradient(circle at 0 0,#e0e7ff,transparent 32%),radial-gradient(circle at 100% 0,#ccfbf1,transparent 30%),linear-gradient(145deg,#f4f7ff,#effdfa)}
button,select{font-family:inherit}
.app{width:min(560px,100%);height:100dvh;margin:auto;padding:10px 12px;display:flex;flex-direction:column;overflow:hidden}
.header{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex:0 0 auto}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:800;background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 7px 18px #4f46e533}.header h1{margin:0;font-size:19px}
.card{min-height:0;flex:1;background:#fffffff2;border-radius:23px;padding:13px;box-shadow:0 16px 42px #1e293b1f;display:flex;flex-direction:column;overflow:hidden}
h2{font-size:20px;margin:0 0 6px}.form-area{flex:0 0 auto}
label{font-size:11px;font-weight:800;margin:6px 0 4px;display:block}.label-unit{font-size:10px;color:#64748b;font-weight:700}.head-unit{font-size:9px;color:#64748b;font-weight:700}
select,.field{width:100%;height:52px;border:1.5px solid #e1e6f0;border-radius:13px;background:#f9fbff;color:#172033;font-family:inherit;font-size:14px}
select{appearance:none;padding:0 38px 0 13px}.select{position:relative}.select:after{content:"⌄";position:absolute;right:13px;top:4px;font-size:22px;color:#4f46e5;pointer-events:none}
.field{display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:800;font-size:20px;user-select:none}.field.placeholder{color:#a5adbb;font-size:13px;font-weight:500}.field.active{border-color:#6366f1;box-shadow:0 0 0 3px #6366f11a;background:#fff}.field .value{overflow:hidden;text-overflow:ellipsis}.unit{font-size:11px;font-weight:800;color:#6366f1;background:#eef0ff;padding:5px 9px;border-radius:8px;flex:0 0 auto}
.result{margin-top:8px;padding:9px 14px;border-radius:17px;color:#fff;background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 9px 22px #4f46e533;flex:0 0 auto}.result-label{font-size:10px;opacity:.85}.result-value{font-size:32px;font-weight:800;line-height:1.18}.result-unit{font-size:9px;opacity:.82}
.keypad{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(5,minmax(0,1fr));gap:6px;margin-top:7px}
.key{min-height:0;border:0;border-radius:12px;background:#f1f4f9;color:#172033;font-size:18px;font-weight:700}.key:active,.small-btn:active,.add-owner:active{transform:scale(.97)}.action{background:#20283a;color:#fff;font-size:13px}.clear{background:#fff0f1;color:#e11d48}.delete{background:#fff4e8;color:#ea580c}.reset-key{background:#eef0ff;color:#4f46e5;font-size:12px}.enter-key{background:#e8f7f4;color:#0f766e;font-size:25px}
.actions{display:grid;grid-template-columns:1fr;gap:7px;margin-top:7px;flex:0 0 auto}.actions button{height:45px;border:0;border-radius:13px;font-size:14px;font-weight:800}.calc{color:#fff;background:linear-gradient(135deg,#0f766e,#06b6a4)}
.special{min-height:0;display:flex;flex-direction:column;overflow:hidden;flex:0 0 43%}
.owner-head{display:grid;grid-template-columns:34px 1.25fr .8fr .95fr 34px;gap:6px;align-items:end;margin-top:3px;color:#334a9b;font-size:11px;font-weight:800;text-align:center;flex:0 0 auto}
.owner-list{min-height:0;overflow:auto;padding:4px 0 2px;scrollbar-width:none;flex:1}.owner-list::-webkit-scrollbar{display:none}
.owner-row{display:grid;grid-template-columns:34px 1.25fr .8fr .95fr 34px;gap:6px;align-items:center;margin-bottom:6px}
.owner-no{width:34px;height:34px;border-radius:50%;background:#f0f3f9;display:grid;place-items:center;font-weight:800;color:#475569;font-size:14px}
.owner-input,.owner-land,.owner-share{height:46px;width:100%;border:1.5px solid #e1e6f0;border-radius:12px;background:#fff;color:#172033;padding:0 9px;font-size:14px;outline:none}
.owner-input:focus,.owner-land:focus,.owner-land.selected{border-color:#6366f1;box-shadow:0 0 0 3px #6366f11a}
.owner-input{font-weight:500}.owner-land{text-align:center;font-weight:700}.owner-share{display:flex;align-items:center;justify-content:center;background:#edf5ff;border-color:#bfdbfe;color:#234b9d;font-size:17px;font-weight:800;white-space:nowrap}
.remove-owner{height:46px;border:1.5px solid #e1e6f0;border-radius:12px;background:#fff;color:#64748b;font-size:20px}.add-owner{height:43px;border:0;border-radius:13px;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-size:14px;font-weight:800;flex:0 0 auto;margin-top:4px}
.owner-summary{margin-top:7px;padding:10px 13px;border-radius:16px;background:#f7f9fd;border:1px solid #e2e7f0;display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:0 0 auto}.sum-label{font-size:9px;color:#697386}.summary-unit{font-weight:800;color:#475569}.sum-value{font-size:22px;font-weight:800;color:#2563eb;line-height:1.15}

.inherit-area{min-height:0;display:flex;flex-direction:column;overflow:hidden;flex:1!important}
.inherit-land-input{height:52px!important;flex:0 0 auto;outline:none;justify-content:flex-start;font-size:19px!important}
.heir-table-head{display:grid;grid-template-columns:1.45fr 70px 105px 76px;gap:6px;align-items:center;margin:7px 0 4px;color:#334a9b;font-size:10px;font-weight:800;text-align:center;flex:0 0 auto}
.heir-list{min-height:0;overflow-y:auto;flex:1;padding:2px 0 3px;scrollbar-width:none}.heir-list::-webkit-scrollbar{display:none}
.heir-row{display:grid;grid-template-columns:1.45fr 70px 105px 76px;gap:6px;align-items:center;margin-bottom:6px}
.heir-name-wrap{display:flex;align-items:center;gap:7px;min-width:0}.heir-check{width:22px;height:22px;accent-color:#4f46e5;flex:0 0 auto}.heir-relation-note{margin:5px 0 2px;padding:6px 9px;border-radius:8px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:11px;line-height:1.4;font-weight:500;}
.heir-name{font-size:11px;font-weight:700;color:#334155}
.heir-count{height:42px;width:100%;border:1.5px solid #e1e6f0;border-radius:11px;background:#fff;text-align:center;font-size:15px;font-weight:800;outline:none;color:#172033}.heir-count:disabled{background:#f7f9fd;color:#a5adbb}.input-error{border-color:#ef4444!important;background:#fff1f2!important;box-shadow:0 0 0 2px #ef444433}.input-ok{border-color:#22c55e!important;background:#f0fdf4!important}.result-ok{background:#ecfdf5!important;border-color:#86efac!important;color:#15803d!important}
.heir-land,.heir-share{height:42px;width:100%;border-radius:11px;background:#edf5ff;border:1px solid #bfdbfe;color:#234b9d;display:grid;place-items:center;font-size:12px;font-weight:800;text-align:center}
.inherit-footer{flex:0 0 auto;padding-top:6px}.inherit-footer .calc{width:100%;height:45px;border:0;border-radius:13px;font-size:14px;font-weight:800}
@media(max-height:680px){.app{padding:7px 10px}.card{padding:10px}.header{margin-bottom:5px}.header h1{font-size:17px}.logo{width:38px;height:38px}.field,select{height:47px}.result{padding:7px 12px}.result-value{font-size:27px}.keypad{gap:4px;margin-top:4px}.key{border-radius:10px}.actions button{height:40px}.owner-input,.owner-land,.owner-share,.remove-owner{height:40px}.owner-no{height:30px;width:30px}.owner-head,.owner-row{grid-template-columns:30px 1.25fr .8fr .95fr 30px;gap:4px}.add-owner{height:38px}}

/* Inheritance full-screen layout */
.inherit-area{flex:1!important;min-height:0!important;overflow:hidden!important}
.inherit-area .heir-list{flex:1 1 auto!important;min-height:0;overflow-y:auto}
.inherit-area .heir-land-result{max-height:none!important;overflow:visible}
#inheritanceArea .heir-intro{flex:0 0 auto}
#inheritanceArea label{flex:0 0 auto}
#inheritLand{flex:0 0 auto}
#inheritanceArea .heir-land-title{flex:0 0 auto}
#inheritanceArea .heir-land-result{flex:0 0 auto}
#inheritanceArea .heir-total{flex:0 0 auto}
body.keyboard-mode #keypadArea{display:none!important}

#inheritanceArea input[type=number]{appearance:textfield}#inheritanceArea input[type=number]::-webkit-inner-spin-button,#inheritanceArea input[type=number]::-webkit-outer-spin-button{appearance:none}

/* Inheritance mode: completely remove the old calculator/keypad space */
body.inheritance-mode #keypadArea{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="header"><div class="logo">▱</div><div><h1>হিস্যা ও জমি ক্যালকুলেটর</h1></div></div>
  <div class="card">
    <div class="form-area">
      <h2 id="title">মালিকের হিস্যা/অংশ নির্ণয়</h2>
      <label>হিসাবের ধরন</label>
      <div class="select"><select id="mode" onchange="modeChange()">
        <option value="share">মালিকের হিস্যা/অংশ নির্ণয়</option>
        <option value="land">খতিয়ানে প্রাপ্ত জমি নির্ণয়</option>
        <option value="schedule">আবেদনে তফসিলে হিস্যা</option>
        <option value="inheritance">উত্তরাধিকার (মুসলিম ফরায়েজ)</option>
      </select></div>
    </div>

    <div id="normalArea">
      <label>মোট জমি <span class="label-unit">(শতাংশ)</span></label>
      <div id="total" class="field placeholder" onclick="active='total';render()"><span class="value"></span><span class="unit">শতাংশ</span></div>

      <label id="secondLabel">খতিয়ানে প্রাপ্ত জমি <span class="label-unit">(শতাংশ)</span></label>
      <div id="second" class="field placeholder" onclick="active='second';render()"><span class="value"></span><span class="unit" id="secondUnit">শতাংশ</span></div>

      <div class="result"><div class="result-label" id="rLabel">খতিয়ানে মালিকের হিস্যা</div><div class="result-value" id="result">০.০০০০</div><div class="result-unit" id="rUnit">অংশ / হিস্যা</div></div>
    </div>

    <div id="scheduleArea" class="special" style="display:none">
      <div class="owner-head"><div>নং</div><div>মালিকের নাম</div><div>প্রাপ্য জমি<br><span class="head-unit">(শতাংশ)</span></div><div>হিস্যা</div><div></div></div>
      <div id="ownerList" class="owner-list"></div>
      <button class="add-owner" onclick="addOwner()">＋ মালিক যোগ করুন</button>
      <div class="owner-summary">
        <div><div class="sum-label">সকলের মোট জমি <span class="summary-unit">(একর)</span></div><div class="sum-value" id="sumLand">০.০০০০</div></div>
        <div><div class="sum-label">মোট হিস্যা</div><div class="sum-value" id="sumShare">০</div></div>
      </div>
    </div>

    <div id="inheritanceArea" class="inherit-area" style="display:none">
      <label>মোট সম্পত্তি <span class="label-unit">(শতাংশ)</span></label>
      <input id="inheritLand" class="field inherit-land-input" inputmode="decimal" type="text" placeholder="মোট জমির পরিমাণ" oninput="digitInput(this)">
      <div id="heirRelationNote" class="heir-relation-note" style="display:none"></div>
      <div class="heir-table-head"><div>উত্তরাধিকারী</div><div>সংখ্যা</div><div>প্রাপ্ত জমি<br><span class="head-unit">(শতাংশ)</span></div><div>হিস্যা</div></div>
      <div class="heir-list" id="heirList"></div>
      <div class="inherit-footer"><button class="calc" onclick="calculate()">ফলাফল</button></div>
    </div>

    <div id="keypadArea" style="display:flex;flex:1;min-height:0;flex-direction:column">
      <div id="normalKeypad" class="keypad">
        <button class="key clear" onclick="clearOne()">C</button><button class="key action" onclick="allClear()">AC</button><button class="key delete" onclick="back()">⌫</button>
        <button class="key" onclick="press('1')">১</button><button class="key" onclick="press('2')">২</button><button class="key" onclick="press('3')">৩</button>
        <button class="key" onclick="press('4')">৪</button><button class="key" onclick="press('5')">৫</button><button class="key" onclick="press('6')">৬</button>
        <button class="key" onclick="press('7')">৭</button><button class="key" onclick="press('8')">৮</button><button class="key" onclick="press('9')">৯</button>
        <button class="key reset-key" onclick="allClear()">রিসেট</button><button class="key" onclick="press('0')">০</button><button class="key" onclick="press('.')">.</button>
      </div>
      <div id="scheduleKeypad" class="keypad" style="display:none">
        <button class="key clear" onclick="clearOne()">C</button><button class="key action" onclick="allClear()">AC</button><button class="key delete" onclick="back()">⌫</button>
        <button class="key" onclick="press('1')">১</button><button class="key" onclick="press('2')">২</button><button class="key" onclick="press('3')">৩</button>
        <button class="key" onclick="press('4')">৪</button><button class="key" onclick="press('5')">৫</button><button class="key" onclick="press('6')">৬</button>
        <button class="key" onclick="press('7')">৭</button><button class="key" onclick="press('8')">৮</button><button class="key" onclick="press('9')">৯</button>
        <button class="key reset-key" onclick="allClear()">রিসেট</button><button class="key" onclick="press('0')">০</button><button class="key enter-key" onclick="nextOwner()">↵</button>
      </div>
      <div id="resultActions" class="actions"><button class="calc" onclick="calculate()">ফলাফল</button></div>
    </div>
  </div>
</div>

<script>
let active='total', v={total:'',second:''};
let owners=[{name:'',land:''}], activeOwner=null, activeOwnerField=null;

const mode=()=>document.getElementById('mode').value;
const bn=x=>String(x).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const fmt2=x=>bn(Number(x).toFixed(2));

function render(){
  let m=mode();
  let t=document.getElementById('total'),s=document.getElementById('second');
  t.querySelector('.value').textContent=v.total?bn(v.total):'মোট জমির পরিমাণ দিন';
  s.querySelector('.value').textContent=v.second?bn(v.second):(m==='share'?'খতিয়ানে প্রাপ্ত জমির পরিমাণ দিন':'মালিকের হিস্যা / অংশ দিন');
  document.getElementById('secondUnit').textContent=m==='share'?'শতাংশ':'(১-১০০০)';
  t.classList.toggle('placeholder',!v.total);s.classList.toggle('placeholder',!v.second);
  t.classList.toggle('active',active==='total' && m!=='schedule');s.classList.toggle('active',active==='second' && m!=='schedule');
  if(m==='schedule') renderOwners();
}

function press(c){
  if(mode()==='schedule'){
    if(activeOwner===null || activeOwnerField!=='land') return;
    let x=owners[activeOwner].land||'';
    if(c==='.' && x.includes('.')) return;
    if(x==='0' && c!=='.') x='';
    let n=Number(x+c);
    if(!Number.isFinite(n)||n>1000) return;
    owners[activeOwner].land=x+c;
    renderOwners();
    return;
  }
  let x=v[active]||'';
  if(c==='.'&&x.includes('.'))return;
  if(x==='0'&&c!=='.')x='';
  let n=Number(x+c);if(!Number.isFinite(n)||n>1000)return;
  v[active]=x+c;render();
}

function back(){
  if(mode()==='schedule'){
    if(activeOwner!==null && activeOwnerField==='land'){
      owners[activeOwner].land=(owners[activeOwner].land||'').slice(0,-1);
      renderOwners();
    }
    return;
  }
  v[active]=(v[active]||'').slice(0,-1);render();
}
function clearOne(){
  if(mode()==='schedule'){
    if(activeOwner!==null && activeOwnerField==='land'){
      owners[activeOwner].land='';
      renderOwners();
    }
    return;
  }
  v[active]='';render();
}
function allClear(){
  if(mode()==='schedule'){
    owners=[{name:'',land:''}];activeOwner=null;activeOwnerField=null;renderOwners();return;
  }
  v={total:'',second:''};
  document.getElementById('result').textContent=mode()==='share'?'০.০০০০':'০.০০';
  active='total';render();
}


const heirTypes=[['স্বামী','husband'],['স্ত্রী','wife'],['পুত্র','son'],['কন্যা','daughter'],['নাতি','sonSon'],['নাতনি','sonDaughter'],['পিতা','father'],['মাতা','mother'],['দাদা','grandfather'],['দাদি','grandmother'],['নানি','maternalGrandmother'],['সহোদর ভাই','fullBrother'],['সহোদর বোন','fullSister'],['সৎ ভাই (বৈমাত্রেয়)','consBrother'],['সৎ বোন (বৈমাত্রেয়)','consSister'],['সৎ ভাই (বৈপিত্রেয়)','uterineBrother'],['সৎ বোন (বৈপিত্রেয়)','uterineSister'],['সহোদর ভাইয়ের পুত্র','fullNephew'],['চাচা','paternalUncle'],['চাচাতো ভাই','cousin']];
let heirs={}; heirTypes.forEach(x=>heirs[x[1]]=0);
function renderHeirs(){
  const list=document.getElementById('heirList');
  list.innerHTML=heirTypes.map(([name,key])=>`<div class="heir-row">
    <div class="heir-name-wrap"><input class="heir-check" type="checkbox" ${heirs[key]>0?'checked':''} onchange="toggleHeir('${key}',this.checked)"><div class="heir-name">${name}</div></div>
    <input class="heir-count" id="hc-${key}" type="text" inputmode="decimal" value="${heirs[key]?bn(heirs[key]):''}" placeholder="০" ${heirs[key]?'':'disabled'} style="display:${heirs[key]?'block':'none'}" oninput="heirCountInput('${key}',this)">
    <div class="heir-land" id="hl-${key}" style="display:${heirs[key]?'grid':'none'}">০.০০০</div>
    <div class="heir-share" id="hs-${key}" style="display:${heirs[key]?'grid':'none'}">০</div>
  </div>`).join('');
  updateHeirRelationNote();
}
function toggleHeir(key,checked){
  heirs[key]=checked?1:0;
  const el=document.getElementById('hc-'+key);
  if(checked) heirs[key]=1;
  if(el){
    el.disabled=!checked;
    el.style.display=checked?'block':'none';
    const l=document.getElementById('hl-'+key);
    const h=document.getElementById('hs-'+key);
    if(l) l.style.display=checked?'grid':'none';
    if(h) h.style.display=checked?'grid':'none';
    updateHeirRelationNote();
  }
  clearInheritanceOutputs();
}
function updateHeirRelationNote(){
  const note=document.getElementById('heirRelationNote');
  if(!note) return;
  const notes=[];
  if(heirs.sonSon>0) notes.push('নাতি = পুত্রের পুত্র। কন্যার পুত্রকে এখানে নাতি হিসেবে ধরা হয়নি।');
  if(heirs.sonDaughter>0) notes.push('নাতনি = পুত্রের কন্যা। কন্যার কন্যাকে এখানে নাতনি হিসেবে ধরা হয়নি।');
  note.innerHTML=notes.map(x=>`<div>${x}</div>`).join('');
  note.style.display=notes.length?'block':'none';
}
function heirCountInput(key,el){
  el.classList.remove('input-error','input-ok');
  el.value=toBnDigits(el.value.replace(/[^0-9০-৯]/g,''));
  const n=parseInt(toEnDigits(el.value)||'0',10);
  heirs[key]=Number.isFinite(n)?Math.max(0,n):0;
  updateHeirRelationNote();
  clearInheritanceOutputs();
}
function clearInheritanceValidation(){
  const landEl=document.getElementById('inheritLand');
  if(landEl) landEl.classList.remove('input-error','input-ok');
  heirTypes.forEach(([name,key])=>{
    const c=document.getElementById('hc-'+key);
    const l=document.getElementById('hl-'+key);
    const h=document.getElementById('hs-'+key);
    if(c) c.classList.remove('input-error','input-ok');
    if(l) l.classList.remove('result-ok');
    if(h) h.classList.remove('result-ok');
  });
}
function clearInheritanceOutputs(){
  heirTypes.forEach(([name,key])=>{
    const l=document.getElementById('hl-'+key),h=document.getElementById('hs-'+key);
    if(l){l.textContent='০.০০০'; if(!heirs[key]) l.style.display='none';}
    if(h){h.textContent='০'; if(!heirs[key]) h.style.display='none';}
  });
}
function toEnDigits(x){return String(x).replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d));}
function toBnDigits(x){return String(x).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);}
function digitInput(el){
  let v=el.value.replace(/[^0-9০-৯.]/g,'');
  let parts=v.split('.');
  if(parts.length>2)v=parts[0]+'.'+parts.slice(1).join('');
  el.value=toBnDigits(toEnDigits(v));
}
function inheritanceCalculate(){
  clearInheritanceValidation();
  const landEl=document.getElementById('inheritLand');
  const land = Number(toEnDigits(landEl.value).replace(/,/g,''));
  let valid=true;
  if(!Number.isFinite(land) || land<=0){
    landEl.classList.add('input-error');
    valid=false;
  } else {
    landEl.classList.add('input-ok');
  }
  const n = k => Number(heirs[k] || 0);
  const checkedKeys=heirTypes.filter(([name,key])=>n(key)>0).map(x=>x[1]);
  if(checkedKeys.length===0){
    valid=false;
  }
  heirTypes.forEach(([name,key])=>{
    if(n(key)>0){
      const c=document.getElementById('hc-'+key);
      if(!Number.isInteger(n(key)) || n(key)<=0){
        if(c) c.classList.add('input-error');
        valid=false;
      } else if(c){ c.classList.add('input-ok'); }
    }
  });
  if(!valid){
    alert(landEl.classList.contains('input-error') ? 'মোট সম্পত্তির সঠিক পরিমাণ দিন।' : 'অন্তত একজন উত্তরাধিকারী নির্বাচন করে সঠিক সংখ্যা দিন।');
    return;
  }

  const hasChildOrMaleDescendant =
    n('son') + n('daughter') + n('sonSon') + n('sonDaughter') > 0;

  const shares = {};
  heirTypes.forEach(([name,key]) => shares[key]=0);

  // ১) স্বামী: সন্তান/পুত্রের সন্তান থাকলে ১/৪, না থাকলে ১/২
  if(n('husband')){
    shares.husband = hasChildOrMaleDescendant ? 1/4 : 1/2;
  }

  // ২) স্ত্রী: সন্তান/পুত্রের সন্তান থাকলে ১/৮, না থাকলে ১/৪
  if(n('wife')){
    shares.wife = hasChildOrMaleDescendant ? 1/8 : 1/4;
  }

  // পিতা
  if(n('father')){
    shares.father = (n('son') + n('sonSon') > 0) ? 1/6 : 0;
  }

  // মাতা
  if(n('mother')){
    const siblingCount = n('fullBrother') + n('fullSister') +
                         n('consBrother') + n('consSister');
    shares.mother =
      hasChildOrMaleDescendant || siblingCount >= 2 ? 1/6 : 1/3;
  }

  // কন্যা: পুত্র না থাকলে নির্ধারিত অংশ
  if(n('daughter') && !n('son')){
    shares.daughter = n('daughter')===1 ? 1/2 : 2/3;
  }

  // পুত্রের কন্যা
  if(n('sonDaughter') && !n('son') && !n('sonSon') && !n('daughter')){
    shares.sonDaughter = n('sonDaughter')===1 ? 1/2 : 2/3;
  }

  // পূর্ণ বোন
  if(n('fullSister') && !n('son') && !n('daughter') &&
     !n('father') && !n('fullBrother')){
    shares.fullSister = n('fullSister')===1 ? 1/2 : 2/3;
  }

  // বৈমাত্রেয় বোন
  if(n('consSister') && !n('son') && !n('daughter') &&
     !n('father') && !n('fullBrother') && !n('fullSister')){
    shares.consSister = n('consSister')===1 ? 1/2 : 2/3;
  }

  // বৈপিত্রেয় ভাই-বোন
  if(n('uterineBrother') + n('uterineSister') > 0 &&
     !hasChildOrMaleDescendant && !n('father')){
    const total = n('uterineBrother') + n('uterineSister');
    if(total===1){
      shares.uterineBrother = n('uterineBrother') ? 1/6 : 0;
      shares.uterineSister  = n('uterineSister') ? 1/6 : 0;
    }else{
      shares.uterineBrother = n('uterineBrother')/total/3;
      shares.uterineSister  = n('uterineSister')/total/3;
    }
  }

  // প্রথমে নির্ধারিত অংশ (জবিউল ফুরুজ)
  let fixed = Object.values(shares).reduce((a,b)=>a+b,0);

  // আউল: মোট অংশ ১-এর বেশি হলে আনুপাতিক হারে কমবে
  if(fixed > 1){
    for(const k in shares) shares[k] /= fixed;
    fixed = 1;
  }

  let residual = Math.max(0, 1-fixed);

  // ৩) পুত্র-কন্যা একসাথে থাকলে অবশিষ্ট অংশ ২:১ অনুপাতে
  // অর্থাৎ ১ জন পুত্র = ২ ইউনিট, ১ জন কন্যা = ১ ইউনিট।
  const childUnits = 2*n('son') + n('daughter');
  if(childUnits > 0){
    shares.son += residual * (2*n('son')) / childUnits;
    shares.daughter += residual * n('daughter') / childUnits;
    residual = 0;
  }
  // পুত্রের পুত্র/কন্যা
  else if(n('sonSon') + n('sonDaughter') > 0){
    const units = 2*n('sonSon') + n('sonDaughter');
    shares.sonSon += residual * (2*n('sonSon')) / units;
    shares.sonDaughter += residual * n('sonDaughter') / units;
    residual = 0;
  }
  // পরবর্তী আসাবা
  else if(n('father')){
    shares.father += residual;
    residual = 0;
  }
  else if(n('grandfather')){
    shares.grandfather += residual;
    residual = 0;
  }
  else if(n('fullBrother') + n('fullSister') > 0){
    const units = 2*n('fullBrother') + n('fullSister');
    shares.fullBrother += residual * (2*n('fullBrother')) / units;
    shares.fullSister += residual * n('fullSister') / units;
    residual = 0;
  }
  else if(n('consBrother') + n('consSister') > 0){
    const units = 2*n('consBrother') + n('consSister');
    shares.consBrother += residual * (2*n('consBrother')) / units;
    shares.consSister += residual * n('consSister') / units;
    residual = 0;
  }
  else if(n('paternalUncle') || n('cousin')){
    if(n('paternalUncle')) shares.paternalUncle += residual;
    else shares.cousin += residual;
    residual = 0;
  }

  // রাদ্দ: আসাবা না থাকলে স্বামী/স্ত্রী বাদে যোগ্য নির্ধারিত অংশে অবশিষ্ট ফেরত
  if(residual > 1e-10){
    let eligible = 0;
    for(const k in shares){
      if(shares[k] > 0 && k!=='husband' && k!=='wife') eligible += shares[k];
    }
    if(eligible){
      for(const k in shares){
        if(shares[k] > 0 && k!=='husband' && k!=='wife'){
          shares[k] += residual * shares[k] / eligible;
        }
      }
    }
  }

  // ফলাফল
  // হিস্যা পূর্ণসংখ্যায় (১০০০ ইউনিটের ভিত্তিতে) দেখানো হবে।
  // প্রদর্শিত সক্রিয় ওয়ারিশদের মোট হিস্যা ঠিক ১০০০ রাখা হবে।
  // মূল exact হিস্যা অপরিবর্তিত থাকবে; জমির হিসাব exact হিস্যা থেকেই হবে।
  // Rounding-এর পর ১/১০০০ ইউনিটের ঘাটতি/বাড়তি হলে সবচেয়ে বড় fractional remainder-এ
  // ০.০০১ করে সমন্বয় করা হয়।
  const active = heirTypes.filter(([name,key])=>n(key)>0).map(([name,key])=>{
    const count=n(key);
    const exact=(shares[key]||0)/count;
    const raw=exact*1000;
    const base=Math.floor(raw+1e-10);
    return {key,count,exact,base,frac:raw-base};
  });

  let used=active.reduce((sum,x)=>sum+x.base*x.count,0);
  let remaining=1000-used;

  // একই relation-এ একাধিক ব্যক্তি থাকলে ০.০০১ সমন্বয় একজনের উপর যাবে।
  // ফলে group row-তে প্রয়োজনে দুই ধরনের per-person হিস্যা দেখানো হবে।
  const adjusted={};
  if(remaining>0){
    const ranked=[];
    active.forEach(x=>{
      for(let i=0;i<x.count;i++) ranked.push({x,i,frac:x.frac});
    });
    ranked.sort((a,b)=>b.frac-a.frac);
    for(let i=0;i<remaining;i++) ranked[i].x._extra=(ranked[i].x._extra||0)+1;
  }else if(remaining<0){
    const ranked=[];
    active.forEach(x=>{
      for(let i=0;i<x.count;i++) ranked.push({x,i,frac:x.frac});
    });
    ranked.sort((a,b)=>a.frac-b.frac);
    for(let i=0;i<Math.abs(remaining);i++) ranked[i].x._minus=(ranked[i].x._minus||0)+1;
  }

  active.forEach(x=>{
    const totalUnits=x.base*x.count+(x._extra||0)-(x._minus||0);
    const baseShare=x.base/1000;
    const altShare=(x.base+((x._extra||0)>0?1:((x._minus||0)>0?-1:0)))/1000;
    const h=document.getElementById('hs-'+x.key);
    const l=document.getElementById('hl-'+x.key);
    // একাধিক ব্যক্তি ও rounding adjustment হলে দুই ধরনের হিস্যা দেখানো হবে,
    // যেমন: ০.৩৩৩ × ২, ০.৩৩৪ × ১।
    if(h){
      if(x.count>1 && ((x._extra||0)>0 || (x._minus||0)>0)){
        const adjustedCount=(x._extra||0)+(x._minus||0);
        const normalCount=x.count-adjustedCount;
        h.textContent=bn(x.base)+' × '+bn(normalCount)+' / '+bn(x.base + ((x._extra||0)>0?1:-1))+' × '+bn(adjustedCount);
      }else{
        h.textContent=bn(Math.round(totalUnits/x.count));
      }
      h.classList.add('result-ok');
    }
    // জমি exact হিস্যা থেকে; display rounding এখানে কোনো জমির পরিবর্তন ঘটাবে না।
    if(l){
      const exactLand=land*x.exact;
      l.textContent=bn(exactLand.toFixed(4));
      l.classList.add('result-ok');
    }
  });
}
function modeChange(){
  const m=mode();
  const share=m==='share', schedule=m==='schedule', inheritance=m==='inheritance';
  document.body.classList.toggle('inheritance-mode', inheritance);

  document.getElementById('title').textContent =
    inheritance ? 'উত্তরাধিকার (মুসলিম ফরায়েজ)' :
    share ? 'মালিকের হিস্যা/অংশ নির্ণয়' :
    m==='land' ? 'খতিয়ানে প্রাপ্ত জমি নির্ণয়' : 'আবেদনে তফসিলে হিস্যা';

  document.getElementById('normalArea').style.display =
    (schedule || inheritance) ? 'none' : 'block';
  document.getElementById('scheduleArea').style.display =
    schedule ? 'flex' : 'none';
  document.getElementById('inheritanceArea').style.display =
    inheritance ? 'flex' : 'none';

  document.getElementById('normalKeypad').style.display =
    (schedule || inheritance) ? 'none' : 'grid';
  document.getElementById('scheduleKeypad').style.display =
    schedule ? 'grid' : 'none';
  document.getElementById('resultActions').style.display =
    (schedule || inheritance) ? 'none' : 'grid';
  document.getElementById('keypadArea').style.display =
    inheritance ? 'none' : 'flex';

  if(inheritance){
    renderHeirs();
    clearInheritanceOutputs();
    return;
  }

  if(schedule){
    if(!owners.length) owners=[{name:'',land:''}];
    activeOwner=0;
    activeOwnerField='land';
    renderOwners();
    return;
  }

  document.getElementById('secondLabel').innerHTML=share
    ? 'খতিয়ানে প্রাপ্ত জমি <span class="label-unit">(শতাংশ)</span>'
    : 'খতিয়ানে মালিকের হিস্যা';

  document.getElementById('rLabel').textContent =
    share ? 'খতিয়ানে মালিকের হিস্যা' : 'খতিয়ানে প্রাপ্ত জমি';
  document.getElementById('rUnit').textContent =
    share ? 'অংশ / হিস্যা' : 'শতাংশ';

  v={total:'',second:''};
  document.getElementById('result').textContent=share?'০.০০০০':'০.০০';
  active='total';
  render();
}

function calculate(){
  if(mode()==='inheritance'){inheritanceCalculate();return;}
  let t=Number(v.total),s=Number(v.second),share=mode()==='share';
  if(!Number.isFinite(t)||t<=0){alert('মোট জমির সঠিক পরিমাণ দিন।');active='total';render();return}
  if(!Number.isFinite(s)||s<=0){alert(share?'খতিয়ানে প্রাপ্ত জমির সঠিক পরিমাণ দিন।':'মালিকের হিস্যার সঠিক মান দিন।');active='second';render();return}
  if(share){
    if(s>t){alert('খতিয়ানে প্রাপ্ত জমি মোট জমির চেয়ে বেশি হতে পারে না।');return}
    document.getElementById('result').textContent=bn((s/t).toFixed(4));
  }else{
    document.getElementById('result').textContent=bn((t*(s<=1?s:s/1000)).toFixed(2));
  }
}

function nextOwner(){
  if(mode()!=='schedule') return;
  if(activeOwner===null) { activeOwner=0; activeOwnerField='land'; renderOwners(); return; }
  if(activeOwnerField!=='land') { activeOwnerField='land'; renderOwners(); return; }

  if(activeOwner < owners.length-1){
    activeOwner++;
    activeOwnerField='land';
    renderOwners();
    return;
  }

  // Last owner: create the next owner and focus its land field.
  owners.push({name:'',land:''});
  activeOwner=owners.length-1;
  activeOwnerField='land';
  renderOwners();
  setTimeout(()=>document.getElementById('ownerList').scrollTop=999999,50);
}

function addOwner(){owners.push({name:'',land:''});renderOwners();setTimeout(()=>document.getElementById('ownerList').scrollTop=999999,50)}
function removeOwner(i){
  if(owners.length===1){owners[0]={name:'',land:''};}
  else owners.splice(i,1);
  if(activeOwner===i){activeOwner=null;activeOwnerField=null;}
  renderOwners();
}
function ownerName(i,el){owners[i].name=el.value}
function ownerLand(i,el){owners[i].land=el.value;updateOwnerShares()}
function focusOwner(i,field){activeOwner=i;activeOwnerField=field}
function renderOwners(){
  const list=document.getElementById('ownerList');
  list.innerHTML=owners.map((o,i)=>{
    const total=owners.reduce((a,x)=>a+(Number(x.land)||0),0);
    const sh=total>0?(Number(o.land)||0)/total*1000:0;
    const share=Number.isFinite(sh)?Math.round(sh):0;
    return `<div class="owner-row">
      <div class="owner-no">${bn(i+1)}</div>
      <input class="owner-input" type="text" inputmode="text" placeholder="মালিকের নাম" value="${esc(o.name)}"
        onfocus="focusOwner(${i},'name')" oninput="ownerName(${i},this)">
      <input class="owner-land ${activeOwner===i && activeOwnerField==='land' ? 'selected' : ''}" type="text" inputmode="decimal" placeholder="০" value="${bn(o.land)}"
        onfocus="focusOwner(${i},'land')" onclick="focusOwner(${i},'land');event.preventDefault();renderOwners()"
       >
      <div class="owner-share">${bn(share)}</div>
      <button class="remove-owner" onclick="removeOwner(${i})">×</button>
    </div>`;
  }).join('');
  const total=owners.reduce((a,x)=>a+(Number(x.land)||0),0);
  document.getElementById('sumLand').textContent=bn((total/100).toFixed(4));
  document.getElementById('sumShare').textContent=bn(total>0?1000:0);
}
function updateOwnerShares(){renderOwners()}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
render();
renderHeirs();
</script>
